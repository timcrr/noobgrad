[project]
name = "noobgrad"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "matplotlib==3.10.8",
    "numpy==2.3.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "tiktoken>=0.14.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "tqdm==4.67.3",
]

[tool.setuptools]
